name: Desktop packages

# Development artifacts only. No releases, tags, or public publication.
on:
  workflow_dispatch:
  push:
    branches: [tauri]
    paths:
      - .github/workflows/desktop-build.yml
      - src-tauri/**
      - scripts/*desktop*.mjs

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            label: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v0.1.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check
      - run: npm run desktop:build
      - run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:check
      - run: npm run desktop:release-check
      - uses: actions/upload-artifact@v4
        with:
          name: omp-${{ matrix.label }}-unsigned
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/custom/*.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/dmg/omp_*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/SHA256SUMS
