name: Desktop packages

# Development artifacts only. No releases, tags, or public publication.
on:
  workflow_dispatch:
  push:
    branches: [tauri]
    paths:
      - .github/workflows/desktop-build.yml
      - src-tauri/**
      - scripts/*desktop*.mjs
      - scripts/desktop-dmg-settings.py

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x64
          - runner: macos-15
            label: macos-arm64
          - runner: macos-15-intel
            label: macos-x64
          - runner: ubuntu-22.04
            label: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check
      - uses: actions/setup-python@v6
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'
      - name: Prepare macOS disk image tools
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/oh-my-gui-dmg"
          "$RUNNER_TEMP/oh-my-gui-dmg/bin/pip" install dmgbuild==2.0.0
          echo "$RUNNER_TEMP/oh-my-gui-dmg/bin" >> "$GITHUB_PATH"
      - run: npm run desktop:build
        env:
          OMP_STYLED_MAC_PREVIEW: 'true'
      - run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:check
        if: runner.os != 'macOS'
      - name: Check bundled macOS backend
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/release/bundle/macos/Oh My GUI.app"
          npm run desktop:check -- "$app/Contents/Resources/resources/runtime" "$app/Contents/MacOS/node"
      - run: npm run desktop:release-check
      - uses: actions/upload-artifact@v4
        with:
          name: omp-${{ matrix.label }}-unsigned
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/custom/*.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/dmg/Oh My GUI_*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/SHA256SUMS
