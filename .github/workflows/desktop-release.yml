name: Prepare signed desktop release

# Explicit dispatch creates a DRAFT only. Publishing remains an owner decision.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag matching package.json (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      OMP_SIGNED_RELEASE: "true"
      OMP_UPDATE_PUBLIC_KEY: ${{ vars.OMP_UPDATE_PUBLIC_KEY }}
      OMP_UPDATE_ENDPOINT: https://github.com/Quaii/oh-my-gui/releases/latest/download/latest.json
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Require signing configuration
        shell: bash
        run: test -n "$OMP_UPDATE_PUBLIC_KEY" && test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check
      - run: npm run desktop:build
        if: runner.os != 'macOS'
      - name: Build and notarize the macOS release
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_CERTIFICATE:?Add the base64-encoded Developer ID Application certificate and private key}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Add the certificate export password}"
          : "${APPLE_ID:?Add the Apple developer account email}"
          : "${APPLE_PASSWORD:?Add an Apple app-specific password for notarization}"
          : "${APPLE_TEAM_ID:?Add the Apple developer team ID}"
          npm run desktop:build
          app="src-tauri/target/release/bundle/macos/Oh My GUI.app"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          npm run desktop:check -- "$app/Contents/Resources/resources/runtime" "$app/Contents/MacOS/node"
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            codesign --verify --strict "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --timeout 15m --output-format json > "$RUNNER_TEMP/notary-dmg.json"
            jq -e '.status == "Accepted"' "$RUNNER_TEMP/notary-dmg.json"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
      - run: npm run desktop:check
        if: runner.os != 'macOS'
      - run: npm run desktop:release-check
      - run: node scripts/desktop-update-manifest.mjs --fragment .tmp/update-release
      - uses: actions/upload-artifact@v4
        with:
          name: signed-updates-${{ matrix.runner }}
          path: .tmp/update-release/*
          if-no-files-found: error
  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
      - uses: actions/download-artifact@v5
        with:
          pattern: signed-updates-*
          path: .tmp/update-release
          merge-multiple: true
      - run: node scripts/desktop-update-manifest.mjs --merge .tmp/update-release
      - name: Create private draft for owner review
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Oh My GUI $RELEASE_TAG" --notes-file .tmp/update-release/release-notes.md
          find .tmp/update-release -maxdepth 1 -type f \( -name 'omp_*' -o -name 'latest.json' -o -name 'SHA256SUMS' \) -print0 | xargs -0 gh release upload "$RELEASE_TAG"
